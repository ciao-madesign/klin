<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klin connections</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Klin connections</h1>
    <p class="lead">Every connection the browser makes on its own, without you opening a site: who receives it, why, and how to turn it off.</p>
    <div id="summary" class="summary" aria-live="polite"></div>
  </header>

  <div class="filters" role="group" aria-label="Filter connections">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="on" aria-pressed="false">Active</button>
    <button type="button" data-filter="off" aria-pressed="false">Off</button>
  </div>

  <section id="list" aria-label="Connections"></section>

  <footer>
    <p id="audit"></p>
    <p>This page shows Klin's default settings. If you changed a setting yourself in <code>about:config</code>, this page does not know. It makes no network requests.</p>
  </footer>
</main>
<script src="page.js"></script>
</body>
</html>
