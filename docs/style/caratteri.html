:root{--bg:#0e0e10;--fg:#f1f1ec;--card:#18181b;--ac:#d4ff2a}
body{margin:0;padding:20px;background:#555;font:14px/1.5 Inter,system-ui,sans-serif}
.tag{color:#fff;font:600 15px Inter,system-ui;margin:0 0 8px}.tag span{font-weight:400}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.p{background:var(--bg);color:var(--fg);padding:18px;font-family:Inter,system-ui,sans-serif}
.t{font-family:var(--d);font-weight:var(--w);letter-spacing:var(--ls);text-transform:var(--tt)}
.logo{font-size:var(--big);line-height:1;margin:0 0 4px}.sl{font-size:13px;opacity:.85;margin:0 0 16px}
.card{border:2px solid var(--fg);border-radius:3px;background:var(--card);padding:12px;margin:10px 0}
.card h2{font-size:var(--h2);line-height:1.1;margin:0 0 8px}
.card p{margin:4px 0;font-size:13px}
.n{font-size:var(--n);line-height:1;color:var(--ac)}
.b{display:inline-block;padding:6px 12px;border:2px solid var(--ac);background:var(--ac);color:#0e0e10;border-radius:3px;font:700 13px Inter,system-ui;margin-top:8px}
